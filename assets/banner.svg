<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460" role="img" aria-label="Azhar Mehmood">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowL" cx="15%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="85%" cy="25%" r="38%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- solid dark canvas so text stays readable on light GitHub theme -->
  <rect width="1500" height="460" fill="url(#bg)"/>
  <rect width="1500" height="460" fill="url(#dots)"/>
  <rect width="1500" height="460" fill="url(#glowL)"/>
  <rect width="1500" height="460" fill="url(#glowR)"/>

  <g stroke="#38BDF8" stroke-opacity="0.22" fill="none" stroke-width="1.5">
    <circle cx="140" cy="230" r="78"/>
    <circle cx="140" cy="230" r="118"/>
    <circle cx="1360" cy="120" r="56"/>
    <circle cx="1360" cy="120" r="92"/>
  </g>

  <text x="750" y="120" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="20" letter-spacing="10" fill="#94A3B8">SOFTWARE DEVELOPER</text>

  <text x="750" y="205" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="78" font-weight="700" fill="url(#nameGrad)">Azhar Mehmood</text>

  <rect x="520" y="235" width="460" height="3" rx="2" fill="url(#line)"/>

  <text x="750" y="290" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="26" fill="#E2E8F0">Automation · Web Scraping · Computer Vision · Full-Stack</text>

  <text x="750" y="340" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="18" fill="#94A3B8">End-to-end systems clients can run — detect · extract · automate · deliver</text>

  <!-- high-contrast chips -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="355" y="380" width="130" height="36" rx="8" fill="#1E293B" stroke="#38BDF8"/>
    <text x="420" y="403" text-anchor="middle" fill="#F8FAFC">Python</text>
    <rect x="505" y="380" width="150" height="36" rx="8" fill="#1E293B" stroke="#2DD4BF"/>
    <text x="580" y="403" text-anchor="middle" fill="#F8FAFC">Playwright</text>
    <rect x="675" y="380" width="120" height="36" rx="8" fill="#1E293B" stroke="#818CF8"/>
    <text x="735" y="403" text-anchor="middle" fill="#F8FAFC">YOLO</text>
    <rect x="815" y="380" width="130" height="36" rx="8" fill="#1E293B" stroke="#38BDF8"/>
    <text x="880" y="403" text-anchor="middle" fill="#F8FAFC">OpenCV</text>
    <rect x="965" y="380" width="120" height="36" rx="8" fill="#1E293B" stroke="#2DD4BF"/>
    <text x="1025" y="403" text-anchor="middle" fill="#F8FAFC">Flask</text>
  </g>
</svg>
