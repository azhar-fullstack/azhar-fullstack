      <stop offset="45%" stop-color="#0B1C33"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="g1" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
