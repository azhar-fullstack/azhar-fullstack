  <text x="700" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" fill="#E2E8F0">Automation · Web Scraping · Computer Vision · Full-Stack</text>

  <text x="700" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#94A3B8">End-to-end systems: detect · extract · automate · deliver</text>

