<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="g1" cx="12%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="90%" cy="20%" r="36%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="480" fill="url(#bg)"/>
  <rect width="1500" height="480" fill="url(#g1)"/>
  <rect width="1500" height="480" fill="url(#g2)"/>

  <!-- side rings -->
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="2">
    <circle cx="130" cy="240" r="70"/>
    <circle cx="130" cy="240" r="110"/>
    <circle cx="1370" cy="130" r="55"/>
    <circle cx="1370" cy="130" r="90"/>
  </g>

  <text x="750" y="115" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="22"
        letter-spacing="12" fill="#CBD5E1">SOFTWARE DEVELOPER</text>

  <text x="750" y="210" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="700"
        fill="url(#name)">Azhar Mehmood</text>

  <rect x="500" y="240" width="500" height="4" rx="2" fill="url(#line)"/>

  <text x="750" y="300" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F1F5F9">
    Automation · Web Scraping · Computer Vision · Full-Stack
  </text>

  <text x="750" y="350" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#94A3B8">
    End-to-end systems — detect · extract · automate · deliver
  </text>

  <!-- chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="310" y="395" width="140" height="42" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="380" y="422" text-anchor="middle" fill="#FFFFFF">Python</text>

    <rect x="470" y="395" width="160" height="42" rx="10" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
    <text x="550" y="422" text-anchor="middle" fill="#FFFFFF">Playwright</text>

    <rect x="650" y="395" width="130" height="42" rx="10" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
    <text x="715" y="422" text-anchor="middle" fill="#FFFFFF">YOLO</text>

    <rect x="800" y="395" width="140" height="42" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="870" y="422" text-anchor="middle" fill="#FFFFFF">OpenCV</text>

    <rect x="960" y="395" width="130" height="42" rx="10" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
    <text x="1025" y="422" text-anchor="middle" fill="#FFFFFF">Flask</text>
  </g>
</svg>
